<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basketball Court - Manifold Engine Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 24px;
    }
    
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      pointer-events: none;
    }
    
    #controls h3 {
      margin-bottom: 10px;
    }
    
    #controls ul {
      list-style: none;
    }
    
    #controls li {
      margin-bottom: 5px;
    }
    
    #controls kbd {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  
  <div id="loading">Loading Manifold Engine...</div>
  
  <div id="controls" style="display: none;">
    <h3>Controls</h3>
    <ul>
      <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> - Move</li>
      <li><kbd>Space</kbd> - Jump</li>
      <li><kbd>Shift</kbd> - Sprint</li>
      <li><kbd>V</kbd> - Toggle camera mode</li>
      <li><kbd>B</kbd> - Toggle fly mode</li>
      <li><kbd>E</kbd> - Grab objects</li>
      <li><kbd>1-9</kbd> - Spawn objects</li>
      <li><kbd>`</kbd> - Toggle editor</li>
      <li><kbd>ESC</kbd> - Unlock cursor</li>
    </ul>
  </div>
  
  <script type="module" src="./index.ts"></script>
  <script>
    // Hide loading screen and show controls when the game is ready
    window.addEventListener('manifold:ready', () => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('controls').style.display = 'block';
    });
  </script>
</body>
</html>
